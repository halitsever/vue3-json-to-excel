version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      npm-major:
        patterns: ["*"]
        update-types: [major]
    ignore:
      # Babel 8 is a migration: core and preset-env have to move together.
      - dependency-name: "@babel/*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Gives the registry a week to pull compromised releases before they reach a PR.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]
